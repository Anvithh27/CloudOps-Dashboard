name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - frontend

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Setup Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker
      run: |
        echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Docker Image
      run: |
        docker build -t anvithh27/cloudops-frontend:${{ github.sha }} .

    - name: Push Docker Image
      run: |
        docker push anvithh27/cloudops-frontend:${{ github.sha }}

    - name: Get GKE Credentials
      run: |
        gcloud container clusters get-credentials cloudops-cluster \
          --region asia-south1 \
          --project ${{ secrets.GCP_PROJECT_ID }}

    - name: Update Deployment
      run: |
        kubectl set image deployment/frontend-deployment \
        frontend=anvithh27/cloudops-frontend:${{ github.sha }}

    - name: Verify Rollout
      run: |
        kubectl rollout status deployment/frontend-deployment
